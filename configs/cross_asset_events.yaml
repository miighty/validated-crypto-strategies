    start_et: "Friday 16:00"
    end_et: "Monday 09:25"
  overnight:
    start_et: "prior equity close"
    end_et: "09:25"
  wild_threshold:
    method: expanding_absolute_quantile
    primary_quantile: 0.95
    sensitivity_quantile: 0.90
